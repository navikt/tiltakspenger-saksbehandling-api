version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "com.github.navikt.*"
        - "no.nav.*"
    ignore:
      # Konsist 0.17.3 krasjer med nyere kotlin-compiler-embeddable; pinnen i build.gradle.kts følger Konsists egen versjon.
      - dependency-name: "org.jetbrains.kotlin:kotlin-compiler-embeddable"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "ghcr.io/navikt/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "nais/*"
        - "navikt/*"
