name: Build and deploy

# Trigges av push til main gjort av et menneske/agent (GitHub-knappen eller gh CLI).
# Merger dependabot-auto-merge-workflowen en PR med GITHUB_TOKEN, trigges denne workflowen ikke
# (GitHub starter ikke workflows fra pushes gjort med GITHUB_TOKEN).
# Dependabot-merger bygges og deployes derfor ved neste vanlige push til main, eller senest ved neste planlagte kjøring (se schedule under).

# Raske påfølgende pushes (f.eks. flere dependabot-merger) ga overlappende NAIS-rollouts,
# der eldre deployer timet ut på readiness-proben og i verste fall vant over nyere (2026-07-16).
# Kjør deployene serielt; ved flere ventende kjøringer vinner den nyeste.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitHooks/**'
      - '.gitignore'
      - '.idea/**'
      - '.nais/alerts.yml'
      - 'clean_lint_and_build.sh'
      - 'CODEOWNERS'
      - 'doc/**'
      - 'docker-compose/**'
      - 'docs/**'
      - 'LICENSE'
      - 'lint_and_build.sh'
  # Planlagt bygg og deploy hverdager kl. 06 norsk tid, også uten kodeendringer: henter nyeste bygg av
  # Chainguard-baseimaget (flytende tagg, se Dockerfile) og tar med Dependabot-merger som ikke trigget workflowen selv.
  # Går gjennom samme test-gate og concurrency-gruppe som en vanlig push.
  schedule:
    - cron: '0 6 * * 1-5'
      timezone: 'Europe/Oslo'

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

# Delte workflows i metarepoet, se https://github.com/navikt/tiltakspenger-workflows/blob/main/.github/workflows/README.md
jobs:
  build:
    name: Test and build
    uses: navikt/tiltakspenger-workflows/.github/workflows/test-og-bygg-gradle.yml@main
    permissions:
      contents: read
      id-token: write
    secrets:
      SLACK_VARSEL_WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  deploy-dev:
    name: Deploy to NAIS (dev)
    needs: build
    uses: navikt/tiltakspenger-workflows/.github/workflows/deploy-nais.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      NAIS_ENV: dev
      IMAGE: ${{ needs.build.outputs.IMAGE }}

  deploy-prod:
    name: Deploy to NAIS (prod)
    needs: build
    uses: navikt/tiltakspenger-workflows/.github/workflows/deploy-nais.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      NAIS_ENV: prod
      IMAGE: ${{ needs.build.outputs.IMAGE }}
