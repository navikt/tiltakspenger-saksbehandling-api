name: Deploy alerts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .nais/alerts.yml
      - .github/workflows/deploy-alerts.yml

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

# Delte workflows i metarepoet, se https://github.com/navikt/tiltakspenger/blob/main/.github/workflows/README.md
jobs:
  deploy-alerts:
    name: Deploy alerts til nais
    uses: navikt/tiltakspenger/.github/workflows/deploy-alerts.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      # Vars-filene i .nais/vars/ tilhører app-deployen; alerts templaterer kun datasource, som workflowen alltid sender selv.
      nais-vars: ingen
