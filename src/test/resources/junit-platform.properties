# Samme setting som i build.gradle, slik at kj�ring av tester via intellij og gradle cli skal gi konsistent resultat
junit.jupiter.testinstance.lifecycle.default=per_class
# Testklasser kj�rer parallelt, metoder i samme klasse sekvensielt (klasse-delte mocks m.m.).
# Tester markert med @IsolatedDatabaseTest serialiseres via ResourceLock.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
